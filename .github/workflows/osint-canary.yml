name: OSINT fixed-email canary

on:
  push:
    branches:
      - fix/public-search-interactive

permissions:
  contents: read

jobs:
  email-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Sherlock source pack
        run: python -m pip install -e .
      - name: Run fixed public email canary
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json
          from sherlock_osa.standalone import StandaloneResearchService

          email = "test@microsoft.com"
          service = StandaloneResearchService()
          result = service.search({"kind": "EMAIL", "query": email})
          research = result.get("research", {})
          evidence = research.get("evidence", [])
          compact = {
              "email": email,
              "status": research.get("status"),
              "stop_reason": research.get("stop_reason"),
              "duration_ms": research.get("duration_ms"),
              "identifiers_seen": research.get("identifiers_seen"),
              "module_invocations": research.get("module_invocations"),
              "evidence_count": len(evidence),
              "tainted_evidence": research.get("tainted_evidence"),
              "providers": [item.get("module") for item in evidence if isinstance(item, dict)],
              "evidence": evidence,
              "sources": result.get("sources"),
          }
          print("OSA_CANARY_RESULT=" + json.dumps(compact, ensure_ascii=False, sort_keys=True))
          if not any(item.get("module") == "holehe.email" for item in evidence if isinstance(item, dict)):
              raise SystemExit("FAIL: no holehe.email evidence")
          PY
